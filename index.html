<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WedScore - O Tribunal do Casamento</title>
  
  <!-- Tailwind CSS & FontAwesome Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- React & ReactDOM (Production Build) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-100 text-stone-800 antialiased selection:bg-rose-100 selection:text-rose-900 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const EVALUATORS = [
      { id: 'Gabriel', name: 'Gabriel', avatar: '👨‍💼', color: 'bg-indigo-600' },
      { id: 'Pamella', name: 'Pamella', avatar: '👰', color: 'bg-rose-500' },
      { id: 'Claudia', name: 'Claudia (Main)', avatar: '👑', color: 'bg-amber-500' }
    ];

    const CRITERIA_CONFIG = [
      { id: 'espaco', name: 'Estrutura & Estética', icon: 'fa-building', desc: 'Beleza, área coberta, plano B para chuva e iluminação' },
      { id: 'gastronomia', name: 'Gastronomia & Bebidas', icon: 'fa-utensils', desc: 'Qualidade do buffet, opções de cardápio e bebidas' },
      { id: 'logistica', name: 'Acesso & Logística', icon: 'fa-map-location-dot', desc: 'Estacionamento, distância para convidados e acesso' },
      { id: 'custo', name: 'Custo-Benefício', icon: 'fa-file-invoice-dollar', desc: 'O que inclui (gerador, móveis, limpeza, equipe)' },
      { id: 'vibe', name: 'Sensação & Vibe', icon: 'fa-heart', desc: 'A nota do coração e o atendimento da equipe' }
    ];

    function App() {
      const [venues, setVenues] = useState(() => {
        try {
          const saved = localStorage.getItem('wedscore_venues_v1');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [activeEvaluator, setActiveEvaluator] = useState('Gabriel');
      const [selectedVenueId, setSelectedVenueId] = useState(null);
      const [isAddingVenue, setIsAddingVenue] = useState(false);

      const [newVenue, setNewVenue] = useState({ name: '', location: '', price: '', notes: '' });

      useEffect(() => {
        try {
          localStorage.setItem('wedscore_venues_v1', JSON.stringify(venues));
        } catch (e) {
          console.error("Erro ao salvar dados locais", e);
        }
      }, [venues]);

      const handleAddVenue = (e) => {
        e.preventDefault();
        if (!newVenue.name.trim()) return;

        const created = {
          id: 'v_' + Date.now(),
          name: newVenue.name,
          location: newVenue.location,
          price: newVenue.price,
          notes: newVenue.notes,
          ratings: {
            Gabriel: { scores: { espaco: 3, gastronomia: 3, logistica: 3, custo: 3, vibe: 3 }, isFavorite: false, isVeto: false, comment: '' },
            Pamella: { scores: { espaco: 3, gastronomia: 3, logistica: 3, custo: 3, vibe: 3 }, isFavorite: false, isVeto: false, comment: '' },
            Claudia: { scores: { espaco: 3, gastronomia: 3, logistica: 3, custo: 3, vibe: 3 }, isFavorite: false, isVeto: false, comment: '' }
          }
        };

        setVenues([...venues, created]);
        setSelectedVenueId(created.id);
        setNewVenue({ name: '', location: '', price: '', notes: '' });
        setIsAddingVenue(false);
      };

      const handleRatingChange = (venueId, criterionId, val) => {
        setVenues(venues.map(v => {
          if (v.id !== venueId) return v;
          const userRatings = v.ratings[activeEvaluator] || { scores: {}, isFavorite: false, isVeto: false, comment: '' };
          return {
            ...v,
            ratings: {
              ...v.ratings,
              [activeEvaluator]: {
                ...userRatings,
                scores: { ...userRatings.scores, [criterionId]: Number(val) }
              }
            }
          };
        }));
      };

      const handleToggleTag = (venueId, tagType) => {
        setVenues(venues.map(v => {
          if (v.id !== venueId) return v;
          const userRatings = v.ratings[activeEvaluator] || { scores: {}, isFavorite: false, isVeto: false, comment: '' };
          return {
            ...v,
            ratings: {
              ...v.ratings,
              [activeEvaluator]: {
                ...userRatings,
                isFavorite: tagType === 'fav' ? !userRatings.isFavorite : false,
                isVeto: tagType === 'veto' ? !userRatings.isVeto : false
              }
            }
          };
        }));
      };

      const handleCommentChange = (venueId, comment) => {
        setVenues(venues.map(v => {
          if (v.id !== venueId) return v;
          const userRatings = v.ratings[activeEvaluator] || { scores: {}, isFavorite: false, isVeto: false, comment: '' };
          return {
            ...v,
            ratings: {
              ...v.ratings,
              [activeEvaluator]: { ...userRatings, comment }
            }
          };
        }));
      };

      const handleDeleteVenue = (venueId) => {
        if (confirm("Deseja realmente remover este local?")) {
          setVenues(venues.filter(v => v.id !== venueId));
          if (selectedVenueId === venueId) setSelectedVenueId(null);
        }
      };

      const getVenueAverage = (venue) => {
        let total = 0;
        let count = 0;
        Object.values(venue.ratings).forEach(r => {
          Object.values(r.scores || {}).forEach(s => {
            total += Number(s);
            count++;
          });
        });
        return count ? (total / count).toFixed(1) : '0.0';
      };

      const activeVenue = venues.find(v => v.id === selectedVenueId);

      return (
        <div className="max-w-md md:max-w-3xl mx-auto min-h-screen pb-12 flex flex-col shadow-xl bg-white">
          <header className="bg-stone-900 text-stone-100 p-4 border-b border-stone-800 flex items-center justify-between sticky top-0 z-20">
            <div className="flex items-center gap-2">
              <span className="text-2xl">💒</span>
              <div>
                <h1 className="font-bold text-lg leading-none tracking-wide text-rose-200">WedScore</h1>
                <p className="text-xs text-stone-400">O Tribunal do Casamento</p>
              </div>
            </div>
            <button
              onClick={() => setIsAddingVenue(true)}
              className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow-sm"
            >
              <i className="fa-solid fa-plus text-xs"></i>
              <span>Novo Local</span>
            </button>
          </header>

          <section className="bg-stone-800 p-3 text-white border-b border-stone-700">
            <p className="text-xs text-stone-400 uppercase font-semibold mb-2 tracking-wider text-center">Quem está avaliando agora?</p>
            <div className="grid grid-cols-3 gap-2">
              {EVALUATORS.map(evaluator => {
                const isActive = activeEvaluator === evaluator.id;
                return (
                  <button
                    key={evaluator.id}
                    onClick={() => setActiveEvaluator(evaluator.id)}
                    className={`py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${
                      isActive 
                        ? `${evaluator.color} text-white shadow-md ring-2 ring-white/50 scale-[1.02]` 
                        : 'bg-stone-700 text-stone-300 hover:bg-stone-650'
                    }`}
                  >
                    <span className="text-lg">{evaluator.avatar}</span>
                    <span>{evaluator.name}</span>
                  </button>
                );
              })}
            </div>
          </section>

          <main className="flex-1 p-4">
            {isAddingVenue && (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <form onSubmit={handleAddVenue} className="bg-white text-stone-800 rounded-2xl p-5 w-full max-w-md shadow-2xl space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h2 className="font-bold text-lg text-stone-900 flex items-center gap-2">
                      <span>📍</span> Cadastrar Espaço
                    </h2>
                    <button type="button" onClick={() => setIsAddingVenue(false)} className="text-stone-400 hover:text-stone-600">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-stone-600 uppercase mb-1">Nome do Espaço *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Villa Bisutti, Mansão Festejar"
                      value={newVenue.name}
                      onChange={e => setNewVenue({ ...newVenue, name: e.target.value })}
                      className="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-stone-600 uppercase mb-1">Localização</label>
                      <input
                        type="text"
                        placeholder="Ex: Zona Sul, SP"
                        value={newVenue.location}
                        onChange={e => setNewVenue({ ...newVenue, location: e.target.value })}
                        className="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-stone-600 uppercase mb-1">Orçamento Estimado</label>
                      <input
                        type="text"
                        placeholder="Ex: R$ 35.000"
                        value={newVenue.price}
                        onChange={e => setNewVenue({ ...newVenue, price: e.target.value })}
                        className="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-stone-600 uppercase mb-1">Anotações Iniciais</label>
                    <textarea
                      placeholder="Capacidade de convidados, itens inclusos..."
                      value={newVenue.notes}
                      onChange={e => setNewVenue({ ...newVenue, notes: e.target.value })}
                      className="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none h-20"
                    ></textarea>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAddingVenue(false)}
                      className="flex-1 border border-stone-300 py-2.5 rounded-lg text-sm font-semibold hover:bg-stone-50"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-lg text-sm font-semibold shadow"
                    >
                      Salvar Local
                    </button>
                  </div>
                </form>
              </div>
            )}

            {venues.length === 0 ? (
              <div className="text-center py-16 px-4 space-y-4">
                <div className="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-2xl">
                  💒
                </div>
                <h3 className="font-bold text-stone-800 text-lg">Nenhum local cadastrado ainda</h3>
                <p className="text-stone-500 text-sm max-w-xs mx-auto">
                  Clique no botão abaixo para adicionar o primeiro espaço de casamento que vocês foram visitar.
                </p>
                <button
                  onClick={() => setIsAddingVenue(true)}
                  className="bg-rose-600 hover:bg-rose-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-md transition inline-flex items-center gap-2"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Cadastrar Primeiro Local</span>
                </button>
              </div>
            ) : (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xs font-bold text-stone-500 uppercase tracking-wider mb-3">Espaços Visitados ({venues.length})</h2>
                  <div className="grid grid-cols-1 gap-3">
                    {venues.map(venue => {
                      const avg = getVenueAverage(venue);
                      const isSelected = venue.id === selectedVenueId;
                      return (
                        <div
                          key={venue.id}
                          onClick={() => setSelectedVenueId(venue.id)}
                          className={`p-4 rounded-xl border transition cursor-pointer flex justify-between items-center ${
                            isSelected 
                              ? 'border-rose-500 bg-rose-50/40 shadow-md ring-1 ring-rose-500' 
                              : 'border-stone-200 bg-white hover:border-stone-300'
                          }`}
                        >
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="font-bold text-stone-900 text-base">{venue.name}</h3>
                              {Object.values(venue.ratings).some(r => r.isFavorite) && (
                                <span className="text-xs bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-medium">❤️ Favorito</span>
                              )}
                              {Object.values(venue.ratings).some(r => r.isVeto) && (
                                <span className="text-xs bg-stone-800 text-stone-200 px-2 py-0.5 rounded-full font-medium">🚫 Vetado</span>
                              )}
                            </div>
                            <p className="text-xs text-stone-500 mt-0.5">{venue.location || 'Sem localização'} {venue.price && `• ${venue.price}`}</p>
                          </div>
                          <div className="text-right flex items-center gap-3">
                            <div>
                              <div className="text-lg font-extrabold text-stone-800">{avg} <span className="text-xs font-normal text-stone-400">/5</span></div>
                              <div className="text-[10px] text-stone-400">Média Geral</div>
                            </div>
                            <i className={`fa-solid fa-chevron-right text-xs transition ${isSelected ? 'text-rose-500 translate-x-0.5' : 'text-stone-300'}`}></i>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {activeVenue && (
                  <div className="bg-white border border-stone-200 rounded-2xl p-5 shadow-sm space-y-6">
                    <div className="flex justify-between items-start border-b pb-4">
                      <div>
                        <span className="text-xs font-semibold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-md">
                          Avaliando como: {activeEvaluator === 'Claudia' ? 'Claudia (Main)' : activeEvaluator}
                        </span>
                        <h2 className="text-xl font-bold text-stone-900 mt-2">{activeVenue.name}</h2>
                        {activeVenue.notes && <p className="text-xs text-stone-500 mt-1">{activeVenue.notes}</p>}
                      </div>
                      <button
                        onClick={() => handleDeleteVenue(activeVenue.id)}
                        className="text-stone-400 hover:text-red-500 p-1 transition"
                        title="Excluir Local"
                      >
                        <i className="fa-solid fa-trash-can text-sm"></i>
                      </button>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => handleToggleTag(activeVenue.id, 'fav')}
                        className={`flex-1 py-2 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                          activeVenue.ratings[activeEvaluator]?.isFavorite
                            ? 'bg-rose-600 text-white border-rose-600 shadow'
                            : 'border-stone-200 text-stone-600 hover:bg-stone-50'
                        }`}
                      >
                        <i className="fa-solid fa-heart"></i>
                        <span>Meu Favorito</span>
                      </button>
                      <button
                        onClick={() => handleToggleTag(activeVenue.id, 'veto')}
                        className={`flex-1 py-2 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                          activeVenue.ratings[activeEvaluator]?.isVeto
                            ? 'bg-stone-900 text-white border-stone-900 shadow'
                            : 'border-stone-200 text-stone-600 hover:bg-stone-50'
                        }`}
                      >
                        <i className="fa-solid fa-ban"></i>
                        <span>Vetar Espaço</span>
                      </button>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-xs font-bold text-stone-500 uppercase tracking-wider">Notas por Categoria</h3>
                      {CRITERIA_CONFIG.map(crit => {
                        const currentVal = activeVenue.ratings[activeEvaluator]?.scores?.[crit.id] || 3;
                        return (
                          <div key={crit.id} className="bg-stone-50 p-3.5 rounded-xl border border-stone-100 space-y-2">
                            <div className="flex justify-between items-center">
                              <div className="flex items-center gap-2">
                                <i className={`fa-solid ${crit.icon} text-stone-500 text-sm`}></i>
                                <span className="font-bold text-sm text-stone-800">{crit.name}</span>
                              </div>
                              <span className="font-extrabold text-sm text-rose-600 bg-white px-2 py-0.5 rounded border border-stone-200 shadow-sm">
                                {currentVal} / 5
                              </span>
                            </div>
                            <p className="text-[11px] text-stone-500">{crit.desc}</p>
                            <input
                              type="range"
                              min="1"
                              max="5"
                              step="1"
                              value={currentVal}
                              onChange={e => handleRatingChange(activeVenue.id, crit.id, e.target.value)}
                              className="w-full accent-rose-600 cursor-pointer h-2 bg-stone-200 rounded-lg"
                            />
                            <div className="flex justify-between text-[10px] text-stone-400 font-medium">
                              <span>1 - Ruim</span>
                              <span>3 - Médio</span>
                              <span>5 - Incrível</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">
                        Considerações de {activeEvaluator === 'Claudia' ? 'Claudia (Main)' : activeEvaluator}
                      </label>
                      <textarea
                        placeholder="O que mais chamou sua atenção ou te preocupou neste local?"
                        value={activeVenue.ratings[activeEvaluator]?.comment || ''}
                        onChange={e => handleCommentChange(activeVenue.id, e.target.value)}
                        className="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-rose-500 outline-none h-24 bg-stone-50 border-stone-200"
                      ></textarea>
                    </div>

                    <div className="border-t pt-4 space-y-3">
                      <h3 className="text-xs font-bold text-stone-500 uppercase tracking-wider">Notas de Todos os Avaliadores</h3>
                      <div className="grid grid-cols-3 gap-2">
                        {EVALUATORS.map(ev => {
                          const userRating = activeVenue.ratings[ev.id];
                          let userAvg = '0.0';
                          if (userRating?.scores) {
                            const values = Object.values(userRating.scores);
                            userAvg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
                          }
                          return (
                            <div key={ev.id} className="bg-stone-50 p-2.5 rounded-xl text-center border border-stone-100">
                              <div className="text-lg">{ev.avatar}</div>
                              <div className="text-xs font-bold text-stone-700">{ev.name}</div>
                              <div className="text-base font-extrabold text-stone-900 my-0.5">{userAvg}</div>
                              {userRating?.isFavorite && <div className="text-[10px] text-rose-600 font-bold">❤️ Favorito</div>}
                              {userRating?.isVeto && <div className="text-[10px] text-stone-900 font-bold">🚫 Vetou</div>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
